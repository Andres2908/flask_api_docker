version: 0.2

phases:
  pre_build:
    commands:
      - echo "Autenticando en Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPO

  build:
    commands:
      - echo "Construyendo imagen Docker..."
      - docker build -t $ECR_REPO:latest .
      - docker tag $ECR_REPO:latest $ECR_REPO:latest

  post_build:
    commands:
      - echo "Empujando imagen a Amazon ECR..."
      - docker push $ECR_REPO:latest
      - echo "Creando archivo de definición de imagen..."
      - cd $CODEBUILD_SRC_DIR
      - printf '[{"name":"first-container","imageUri":"%s"}]' $ECR_REPO:latest > imagedefinitions.json
      - ls -l imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
  base-directory: .
  discard-paths: yes
  name: my-artifact.zip
